<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log Aktivitas - SIMBAR PLN</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <div class="content">
      <div class="card">
        <div class="card-body">
          <div class="row g-2 mb-3"><div class="col-md-5"><input type="search" id="q" class="form-control" placeholder="Cari user / aksi / detail..."></div></div>
          <div class="table-responsive">
            <table class="table table-hover table-sm">
              <thead><tr><th>Waktu</th><th>User</th><th>Aksi</th><th>Detail</th><th>IP</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div id="pager"></div>
        </div>
      </div>
    </div>
    <div class="app-footer">SIMBAR PLN &middot; Sistem Monitoring Barang</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (async () => {
    const user = await initPage('Log Aktivitas');
    if (!user) return;
    let page = 1;
    async function load() {
      $('#rows').innerHTML = loadingRow(5);
      try {
        const r = await api('logs.php', { params: { page, per_page: 15, q: $('#q').value.trim() } });
        $('#rows').innerHTML = r.data.length ? r.data.map((l) => `<tr>
          <td class="text-nowrap">${fmtDateTime(l.created_at)}</td><td>${esc(l.username || '-')}</td>
          <td><span class="badge ${l.aksi === 'LOGIN_GAGAL' ? 'badge-habis' : 'text-bg-light border'}">${esc(l.aksi)}</span></td>
          <td>${esc(l.detail || '')}</td><td class="text-muted">${esc(l.ip || '')}</td></tr>`).join('') : emptyRow(5);
        renderPagination($('#pager'), r, (p) => { page = p; load(); });
      } catch (e) { toast(e.message, 'error'); }
    }
    $('#q').addEventListener('input', debounce(() => { page = 1; load(); }));
    load();
  })();
  </script>
</body>
</html>
