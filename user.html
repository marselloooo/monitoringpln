<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manajemen User - SIMBAR PLN</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <div class="content">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Daftar Pengguna</span>
          <button class="btn btn-pln btn-sm" id="btnAdd"><i class="bi bi-person-plus me-1"></i>Tambah User</button>
        </div>
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead><tr><th>Nama</th><th>Username</th><th>Role</th><th>Status</th><th>Dibuat</th><th class="text-end">Aksi</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="app-footer">SIMBAR PLN &middot; Sistem Monitoring Barang</div>
  </div>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="form" novalidate>
      <div class="modal-header"><h6 class="modal-title" id="mTitle"></h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">Nama Lengkap *</label><input name="nama" class="form-control" maxlength="100" required></div>
        <div class="mb-3"><label class="form-label">Username *</label><input name="username" class="form-control" maxlength="50" autocomplete="off" required></div>
        <div class="mb-3"><label class="form-label">Role *</label><select name="role_id" class="form-select" required></select></div>
        <div class="mb-3"><label class="form-label" id="passLabel">Password *</label><input name="password" type="password" class="form-control" autocomplete="new-password">
          <div class="form-text" id="passHelp">Minimal 6 karakter.</div></div>
        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" name="aktif" id="aktif" checked><label class="form-check-label" for="aktif">Akun aktif</label></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button><button class="btn btn-pln" id="btnSave">Simpan</button></div>
    </form></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (async () => {
    const me = await initPage('Manajemen User');
    if (!me) return;
    const modal = new bootstrap.Modal($('#modal'));
    const form = $('#form');
    let users = [], editId = null;

    const roles = (await api('users.php', { params: { roles: 1 } })).data;
    const roleName = { admin: 'Administrator', petugas: 'Petugas Gudang', manajer: 'Manajer' };
    form.role_id.innerHTML = roles.map((r) => `<option value="${r.id}">${esc(roleName[r.nama] || r.nama)}</option>`).join('');

    async function load() {
      $('#rows').innerHTML = loadingRow(6);
      try {
        users = (await api('users.php')).data;
        $('#rows').innerHTML = users.map((u) => `<tr>
          <td><strong>${esc(u.nama)}</strong></td><td><code>${esc(u.username)}</code></td>
          <td><span class="badge text-bg-light border">${esc(roleName[u.role] || u.role)}</span></td>
          <td>${Number(u.aktif) ? '<span class="badge badge-aman">Aktif</span>' : '<span class="badge badge-habis">Nonaktif</span>'}</td>
          <td>${fmtDate(u.created_at)}</td>
          <td class="text-end"><button class="btn btn-sm btn-light" data-edit="${u.id}"><i class="bi bi-pencil"></i> Ubah / Reset</button></td></tr>`).join('');
        $$('[data-edit]').forEach((b) => b.addEventListener('click', () => openForm(b.dataset.edit)));
      } catch (e) { toast(e.message, 'error'); }
    }

    function openForm(id = null) {
      editId = id;
      form.reset(); showFieldErrors(form, {});
      const u = id ? users.find((x) => String(x.id) === String(id)) : null;
      $('#mTitle').textContent = u ? 'Ubah User' : 'Tambah User';
      form.username.disabled = !!u;
      $('#passLabel').textContent = u ? 'Reset Password (opsional)' : 'Password *';
      $('#passHelp').textContent = u ? 'Kosongkan jika tidak ingin mengganti password.' : 'Minimal 6 karakter.';
      if (u) { form.nama.value = u.nama; form.username.value = u.username; form.role_id.value = u.role_id; form.aktif.checked = !!Number(u.aktif); }
      modal.show();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); showFieldErrors(form, {});
      const body = { nama: form.nama.value, username: form.username.value, role_id: form.role_id.value, password: form.password.value, aktif: form.aktif.checked };
      try {
        const res = await withLoading($('#btnSave'), () => api('users.php', { method: editId ? 'PUT' : 'POST', params: editId ? { id: editId } : null, body }));
        toast(res.message); modal.hide(); load();
      } catch (err) { showFieldErrors(form, err.errors); toast(err.message, 'error'); }
    });

    $('#btnAdd').addEventListener('click', () => openForm());
    load();
  })();
  </script>
</body>
</html>
