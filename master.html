<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Data - SIMBAR PLN</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <div class="content">
      <div class="card">
        <div class="card-header pb-0 border-0">
          <ul class="nav nav-tabs card-header-tabs" id="tabs"></ul>
        </div>
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0" id="tabTitle"></h6>
            <button class="btn btn-pln" id="btnAdd"><i class="bi bi-plus-lg me-1"></i>Tambah</button>
          </div>
          <div class="table-responsive">
            <table class="table table-hover"><thead id="thead"></thead><tbody id="rows"></tbody></table>
          </div>
        </div>
      </div>
    </div>
    <div class="app-footer">SIMBAR PLN &middot; Sistem Monitoring Barang</div>
  </div>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="form" novalidate>
      <div class="modal-header"><h6 class="modal-title" id="mTitle"></h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="fields"></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button><button class="btn btn-pln" id="btnSave">Simpan</button></div>
    </form></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (async () => {
    const user = await initPage('Master Data');
    if (!user) return;
    const canDelete = user.role === 'admin';

    const TABS = {
      categories: { label: 'Kategori', icon: 'bi-tags', fields: [['nama', 'Nama Kategori', true], ['keterangan', 'Keterangan']] },
      units:      { label: 'Satuan', icon: 'bi-rulers', fields: [['nama', 'Nama Satuan', true]] },
      warehouses: { label: 'Gudang', icon: 'bi-building', fields: [['nama', 'Nama Gudang', true], ['lokasi', 'Lokasi']] },
      suppliers:  { label: 'Supplier', icon: 'bi-truck', fields: [['nama', 'Nama Supplier', true], ['alamat', 'Alamat'], ['telepon', 'Telepon']] },
    };
    let type = 'categories', editId = null, rowsData = [];
    const modal = new bootstrap.Modal($('#modal'));
    const form = $('#form');

    $('#tabs').innerHTML = Object.entries(TABS).map(([k, t]) =>
      `<li class="nav-item"><a href="#" class="nav-link" data-t="${k}"><i class="bi ${t.icon} me-1"></i>${t.label}</a></li>`).join('');

    function setTab(t) {
      type = t;
      $$('#tabs .nav-link').forEach((a) => a.classList.toggle('active', a.dataset.t === t));
      $('#tabTitle').textContent = 'Daftar ' + TABS[t].label;
      $('#thead').innerHTML = '<tr><th style="width:50px">#</th>' + TABS[t].fields.map((f) => `<th>${f[1].replace(/^Nama /, '')}</th>`).join('') + '<th class="text-end">Aksi</th></tr>';
      load();
    }

    async function load() {
      const cols = TABS[type].fields.length + 2;
      $('#rows').innerHTML = loadingRow(cols);
      try {
        rowsData = (await api('master.php', { params: { type } })).data;
        $('#rows').innerHTML = rowsData.length ? rowsData.map((r, n) => `<tr><td>${n + 1}</td>` +
          TABS[type].fields.map((f) => `<td>${esc(r[f[0]] || '-')}</td>`).join('') +
          `<td class="text-end text-nowrap"><button class="btn btn-sm btn-light" data-edit="${r.id}"><i class="bi bi-pencil"></i></button>
           ${canDelete ? `<button class="btn btn-sm btn-light text-danger" data-del="${r.id}"><i class="bi bi-trash"></i></button>` : ''}</td></tr>`).join('') : emptyRow(cols);
        $$('[data-edit]').forEach((b) => b.addEventListener('click', () => openForm(b.dataset.edit)));
        $$('[data-del]').forEach((b) => b.addEventListener('click', () => remove(b.dataset.del)));
      } catch (e) { toast(e.message, 'error'); }
    }

    function openForm(id = null) {
      editId = id;
      const row = id ? rowsData.find((r) => String(r.id) === String(id)) : {};
      $('#mTitle').textContent = (id ? 'Ubah ' : 'Tambah ') + TABS[type].label;
      $('#fields').innerHTML = TABS[type].fields.map(([k, label, req]) =>
        `<div class="mb-3"><label class="form-label">${label}${req ? ' *' : ''}</label><input name="${k}" class="form-control" value="${esc(row[k] || '')}" ${req ? 'required' : ''}></div>`).join('');
      modal.show();
    }

    async function remove(id) {
      const row = rowsData.find((r) => String(r.id) === String(id));
      if (!(await confirmBox(`Hapus ${TABS[type].label.toLowerCase()} "${row.nama}"?`, { title: 'Hapus Data' }))) return;
      try { await api('master.php', { method: 'DELETE', params: { type, id } }); toast('Data dihapus.'); load(); }
      catch (e) { toast(e.message, 'error'); }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showFieldErrors(form, {});
      const body = Object.fromEntries(new FormData(form));
      try {
        const res = await withLoading($('#btnSave'), () => api('master.php', { method: editId ? 'PUT' : 'POST', params: { type, id: editId }, body }));
        toast(res.message); modal.hide(); load();
      } catch (err) { showFieldErrors(form, err.errors); toast(err.message, 'error'); }
    });

    $('#btnAdd').addEventListener('click', () => openForm());
    $$('#tabs .nav-link').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); setTab(a.dataset.t); }));
    setTab('categories');
  })();
  </script>
</body>
</html>
