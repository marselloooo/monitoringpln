<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barang Keluar - SIMBAR PLN</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <div class="content">

      <div class="card mb-3" id="formCard">
        <div class="card-header"><i class="bi bi-box-arrow-up text-danger me-1"></i>Input Barang Keluar</div>
        <form class="card-body" id="form" novalidate>
          <div class="row g-3 mb-3">
            <div class="col-md-4"><label class="form-label">No. Permintaan *</label><input name="no_permintaan" class="form-control" maxlength="60" required></div>
            <div class="col-md-3"><label class="form-label">Tanggal *</label><input name="tanggal" type="date" class="form-control" required></div>
            <div class="col-md-5"><label class="form-label">Unit / Tujuan Pemakaian *</label><input name="tujuan" class="form-control" maxlength="150" placeholder="mis. Pemeliharaan Jaringan Rayon A" required></div>
            <div class="col-md-5"><label class="form-label">Penerima *</label><input name="penerima" class="form-control" maxlength="100" required></div>
            <div class="col-md-7"><label class="form-label">Keterangan</label><input name="keterangan" class="form-control" maxlength="255"></div>
          </div>
          <label class="form-label">Daftar Barang *</label>
          <div id="lines"></div>
          <datalist id="itemList"></datalist>
          <button type="button" class="btn btn-sm btn-outline-primary mb-3" id="btnAddLine"><i class="bi bi-plus-lg me-1"></i>Tambah baris</button>
          <div class="text-end"><button class="btn btn-pln" id="btnSave"><i class="bi bi-save me-1"></i>Simpan Barang Keluar</button></div>
        </form>
      </div>

      <div class="card">
        <div class="card-header">Riwayat Barang Keluar</div>
        <div class="card-body">
          <div class="row g-2 mb-3">
            <div class="col-md-5"><input type="search" id="hq" class="form-control" placeholder="Cari no. permintaan / tujuan / penerima..."></div>
            <div class="col-6 col-md-3"><input type="date" id="hfrom" class="form-control" title="Dari tanggal"></div>
            <div class="col-6 col-md-3"><input type="date" id="hto" class="form-control" title="Sampai tanggal"></div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover">
              <thead><tr><th>Tanggal</th><th>No. Permintaan</th><th>Tujuan</th><th>Penerima</th><th class="text-end">Jenis</th><th class="text-end">Total Qty</th><th class="text-end">Detail</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div id="pager"></div>
        </div>
      </div>
    </div>
    <div class="app-footer">SIMBAR PLN &middot; Sistem Monitoring Barang</div>
  </div>

  <div class="modal fade" id="dModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">Detail Barang Keluar</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="dBody"></div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/transaksi.js"></script>
  <script>
    initTransaction({
      title: 'Barang Keluar',
      endpoint: 'outgoing.php',
      refField: 'no_permintaan',
      prefix: 'REQ',
      checkStock: true,
      cols: 7,
      historyRow: (t) => `<tr><td>${fmtDate(t.tanggal)}</td><td><strong>${esc(t.no_permintaan)}</strong></td><td>${esc(t.tujuan)}</td><td>${esc(t.penerima)}</td>
        <td class="text-end">${t.jenis}</td><td class="text-end">${fmtNum(t.total_jumlah)}</td>
        <td class="text-end"><button class="btn btn-sm btn-light" data-detail="${t.id}"><i class="bi bi-eye"></i></button></td></tr>`,
      detailHead: (d) => `<dl class="row mb-2 small">
        <dt class="col-4">No. Permintaan</dt><dd class="col-8">${esc(d.no_permintaan)}</dd>
        <dt class="col-4">Tanggal</dt><dd class="col-8">${fmtDate(d.tanggal)}</dd>
        <dt class="col-4">Tujuan</dt><dd class="col-8">${esc(d.tujuan)}</dd>
        <dt class="col-4">Penerima</dt><dd class="col-8">${esc(d.penerima)}</dd>
        <dt class="col-4">Keterangan</dt><dd class="col-8">${esc(d.keterangan || '-')}</dd>
        <dt class="col-4">Diinput oleh</dt><dd class="col-8">${esc(d.petugas)}</dd></dl>`,
    });
  </script>
</body>
</html>
