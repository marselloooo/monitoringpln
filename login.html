<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - SIMBAR PLN</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <section class="auth-hero">
      <div class="bolt"><i class="bi bi-lightning-charge-fill"></i></div>
      <h1>SIMBAR PLN</h1>
      <p class="lead" style="max-width:460px;opacity:.9">Sistem Informasi Monitoring Barang &amp; Material gudang.</p>
    </section>
    <section class="auth-form">
      <form class="box" id="loginForm" novalidate>
        <h4 class="fw-bold mb-1">Masuk</h4>
        <p class="text-muted mb-4">Gunakan akun yang diberikan administrator.</p>

        <div class="alert alert-danger py-2 d-none" id="err"></div>

        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" autocomplete="username" autofocus required>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" autocomplete="current-password" required>
            <button class="btn btn-outline-secondary" type="button" id="toggle" aria-label="Tampilkan password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button class="btn btn-pln btn-lg w-100" id="btn" type="submit">Masuk</button>

        <div class="mt-4 p-3 rounded small" style="background:#F3F6FA">
          <strong>Akun demo</strong><br>
          admin / admin123<br>petugas / petugas123<br>manajer / manajer123
        </div>
        <a href="index.html" class="d-block text-center mt-3 small text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> Kembali ke beranda</a>
      </form>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    if (Store.get(TOKEN_KEY)) location.replace('dashboard.html');

    $('#toggle').addEventListener('click', () => {
      const p = $('#password');
      p.type = p.type === 'password' ? 'text' : 'password';
      $('#toggle i').className = 'bi ' + (p.type === 'password' ? 'bi-eye' : 'bi-eye-slash');
    });

    $('#loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = $('#err');
      err.classList.add('d-none');
      const username = $('#username').value.trim();
      const password = $('#password').value;
      if (!username || !password) {
        err.textContent = 'Username dan password wajib diisi.';
        err.classList.remove('d-none');
        return;
      }
      try {
        const res = await withLoading($('#btn'), () => api('login.php', { method: 'POST', body: { username, password } }));
        Store.set(TOKEN_KEY, res.token);
        Store.set(USER_KEY, JSON.stringify(res.user));
        location.href = 'dashboard.html';
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
