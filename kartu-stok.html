<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kartu Stok - SIMBAR PLN</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <div class="content">
      <div class="card mb-3 no-print">
        <div class="card-body">
          <div class="row g-2 align-items-end">
            <div class="col-md-5"><label class="form-label">Barang</label>
              <input id="item" class="form-control" list="itemList" placeholder="Ketik kode / nama barang..." autocomplete="off">
              <datalist id="itemList"></datalist></div>
            <div class="col-6 col-md-2"><label class="form-label">Dari</label><input type="date" id="from" class="form-control"></div>
            <div class="col-6 col-md-2"><label class="form-label">Sampai</label><input type="date" id="to" class="form-control"></div>
            <div class="col-md-3 d-flex gap-2">
              <button class="btn btn-pln flex-fill" id="btnShow"><i class="bi bi-search me-1"></i>Tampilkan</button>
              <button class="btn btn-light" id="btnPrint" title="Cetak"><i class="bi bi-printer"></i></button>
            </div>
          </div>
        </div>
      </div>

      <div class="card" id="result" style="display:none">
        <div class="card-body">
          <div class="print-only mb-2"><h5>KARTU STOK BARANG</h5></div>
          <div class="row g-3 mb-3" id="info"></div>
          <div class="table-responsive">
            <table class="table table-hover">
              <thead><tr><th>Tanggal</th><th>Jenis</th><th>Referensi</th><th>Keterangan</th><th class="text-end">Masuk</th><th class="text-end">Keluar</th><th class="text-end">Saldo</th><th>Petugas</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="empty card" id="hint"><div class="card-body"><i class="bi bi-journal-text"></i>Pilih barang untuk melihat riwayat mutasi stoknya.</div></div>
    </div>
    <div class="app-footer">SIMBAR PLN &middot; Sistem Monitoring Barang</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (async () => {
    const user = await initPage('Kartu Stok');
    if (!user) return;
    const items = (await api('items.php', { params: { all: 1 } })).data;
    const byLabel = new Map(items.map((i) => [`${i.kode} - ${i.nama}`, i]));
    $('#itemList').innerHTML = items.map((i) => `<option value="${esc(i.kode + ' - ' + i.nama)}"></option>`).join('');

    async function show() {
      const it = byLabel.get($('#item').value);
      if (!it) return toast('Pilih barang dari daftar yang tersedia.', 'error');
      try {
        const r = await withLoading($('#btnShow'), () => api('stock_card.php', { params: { item_id: it.id, from: $('#from').value, to: $('#to').value } }));
        const i = r.item;
        $('#info').innerHTML = `
          <div class="col-md-6"><h5 class="mb-1">${esc(i.nama)}</h5><div class="text-muted">${esc(i.kode)} &middot; ${esc(i.kategori)} &middot; ${esc(i.gudang)}</div></div>
          <div class="col-md-6 text-md-end"><div class="text-muted small">Stok saat ini</div>
            <div class="fs-4 fw-bold">${fmtNum(i.stock)} <small class="fs-6 text-muted">${esc(i.satuan)}</small> ${statusBadge(i.stock, i.stok_min)}</div></div>`;
        $('#rows').innerHTML = r.data.length ? r.data.map((l) => `
          <tr><td>${fmtDate(l.tanggal)}</td><td>${tipeBadge(l.tipe)}</td><td>${esc(l.referensi || '-')}</td><td>${esc(l.keterangan || '-')}</td>
          <td class="text-end text-success">${l.tipe !== 'keluar' ? fmtNum(l.jumlah) : ''}</td>
          <td class="text-end text-danger">${l.tipe === 'keluar' ? fmtNum(l.jumlah) : ''}</td>
          <td class="text-end fw-bold">${fmtNum(l.stok_sesudah)}</td><td>${esc(l.petugas)}</td></tr>`).join('') : emptyRow(8, 'Tidak ada mutasi pada periode ini');
        $('#result').style.display = '';
        $('#hint').style.display = 'none';
      } catch (e) { toast(e.message, 'error'); }
    }

    $('#btnShow').addEventListener('click', show);
    $('#item').addEventListener('change', show);
    $('#btnPrint').addEventListener('click', () => window.print());

    // Dibuka dari tombol kartu stok di Data Barang: ?item=ID
    const pre = Number(new URLSearchParams(location.search).get('item'));
    const found = items.find((i) => Number(i.id) === pre);
    if (found) { $('#item').value = `${found.kode} - ${found.nama}`; show(); }
  })();
  </script>
</body>
</html>
