<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Barang - SIMBAR PLN</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <div class="content">
      <div class="card">
        <div class="card-body">
          <div class="row g-2 align-items-end mb-3">
            <div class="col-12 col-md-4"><label class="form-label">Cari</label>
              <input type="search" id="fq" class="form-control" placeholder="Kode atau nama barang..."></div>
            <div class="col-6 col-md-2"><label class="form-label">Kategori</label><select id="fcat" class="form-select"></select></div>
            <div class="col-6 col-md-2"><label class="form-label">Gudang</label><select id="fwh" class="form-select"></select></div>
            <div class="col-6 col-md-2">
              <div class="form-check mt-4"><input class="form-check-input" type="checkbox" id="flow"><label class="form-check-label" for="flow">Stok menipis</label></div>
            </div>
            <div class="col-6 col-md-2 text-end" id="addWrap"></div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover">
              <thead><tr><th>Kode</th><th>Nama Barang</th><th>Kategori</th><th>Gudang</th><th class="text-end">Stok</th><th>Min.</th><th>Status</th><th class="text-end no-print">Aksi</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div id="pager"></div>
        </div>
      </div>
    </div>
    <div class="app-footer">SIMBAR PLN &middot; Sistem Monitoring Barang</div>
  </div>

  <!-- Modal tambah/ubah -->
  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable"><form class="modal-content" id="form" novalidate>
      <div class="modal-header"><h6 class="modal-title" id="mTitle">Tambah Barang</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body"><div class="row g-3">
        <div class="col-md-4"><label class="form-label">Kode Barang *</label><input name="kode" class="form-control text-uppercase" maxlength="30" required></div>
        <div class="col-md-8"><label class="form-label">Nama Barang *</label><input name="nama" class="form-control" maxlength="150" required></div>
        <div class="col-md-4"><label class="form-label">Kategori *</label><select name="category_id" class="form-select" required></select></div>
        <div class="col-md-4"><label class="form-label">Satuan *</label><select name="unit_id" class="form-select" required></select></div>
        <div class="col-md-4"><label class="form-label">Lokasi Gudang *</label><select name="warehouse_id" class="form-select" required></select></div>
        <div class="col-md-6" id="stokWrap"><label class="form-label">Stok Awal</label><input name="stock" type="number" min="0" step="any" value="0" class="form-control">
          <div class="form-text">Stok selanjutnya berubah lewat transaksi masuk/keluar.</div></div>
        <div class="col-md-6"><label class="form-label">Stok Minimum</label><input name="stok_min" type="number" min="0" step="any" value="0" class="form-control">
          <div class="form-text">Peringatan muncul jika stok &le; nilai ini.</div></div>
        <div class="col-12"><label class="form-label">Spesifikasi</label><textarea name="spesifikasi" rows="3" class="form-control" maxlength="2000"></textarea></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button><button class="btn btn-pln" id="btnSave">Simpan</button></div>
    </form></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  (async () => {
    const user = await initPage('Data Barang');
    if (!user) return;
    const canEdit = ['admin', 'petugas'].includes(user.role);
    const canDelete = user.role === 'admin';
    const modal = new bootstrap.Modal($('#modal'));
    const form = $('#form');
    let master, page = 1, editId = null;

    master = await loadMaster(['categories', 'units', 'warehouses']);
    $('#fcat').innerHTML = options(master.categories, '', 'Semua');
    $('#fwh').innerHTML = options(master.warehouses, '', 'Semua');
    form.category_id.innerHTML = options(master.categories, '', '-- Pilih --');
    form.unit_id.innerHTML = options(master.units, '', '-- Pilih --');
    form.warehouse_id.innerHTML = options(master.warehouses, '', '-- Pilih --');
    if (canEdit) $('#addWrap').innerHTML = '<button class="btn btn-pln" id="btnAdd"><i class="bi bi-plus-lg me-1"></i>Tambah</button>';

    async function load() {
      $('#rows').innerHTML = loadingRow(8);
      try {
        const r = await api('items.php', { params: { page, per_page: 10, q: $('#fq').value.trim(), category_id: $('#fcat').value, warehouse_id: $('#fwh').value, low: $('#flow').checked ? 1 : '' } });
        $('#rows').innerHTML = r.data.length ? r.data.map((i) => {
          const pct = Math.min(100, Number(i.stok_min) > 0 ? (Number(i.stock) / (Number(i.stok_min) * 3)) * 100 : 100);
          return `<tr>
            <td><code>${esc(i.kode)}</code></td>
            <td><strong>${esc(i.nama)}</strong>${i.spesifikasi ? `<br><small class="text-muted">${esc(i.spesifikasi)}</small>` : ''}</td>
            <td>${esc(i.kategori)}</td><td>${esc(i.gudang)}</td>
            <td class="text-end"><strong>${fmtNum(i.stock)}</strong> <small class="text-muted">${esc(i.satuan)}</small>
              <div class="stock-bar mt-1"><span class="${Number(i.menipis) ? 'low' : ''}" style="width:${pct}%"></span></div></td>
            <td>${fmtNum(i.stok_min)}</td><td>${statusBadge(i.stock, i.stok_min)}</td>
            <td class="text-end text-nowrap no-print">
              <a class="btn btn-sm btn-light" title="Kartu stok" href="kartu-stok.html?item=${i.id}"><i class="bi bi-journal-text"></i></a>
              ${canEdit ? `<button class="btn btn-sm btn-light" title="Ubah" data-edit="${i.id}"><i class="bi bi-pencil"></i></button>` : ''}
              ${canDelete ? `<button class="btn btn-sm btn-light text-danger" title="Hapus" data-del="${i.id}" data-name="${esc(i.nama)}"><i class="bi bi-trash"></i></button>` : ''}
            </td></tr>`;
        }).join('') : emptyRow(8, 'Barang tidak ditemukan');
        renderPagination($('#pager'), r, (p) => { page = p; load(); });
        $$('[data-edit]').forEach((b) => b.addEventListener('click', () => openForm(b.dataset.edit)));
        $$('[data-del]').forEach((b) => b.addEventListener('click', () => remove(b.dataset.del, b.dataset.name)));
      } catch (e) { toast(e.message, 'error'); $('#rows').innerHTML = emptyRow(8, 'Gagal memuat data'); }
    }

    async function openForm(id = null) {
      editId = id;
      form.reset();
      showFieldErrors(form, {});
      $('#mTitle').textContent = id ? 'Ubah Barang' : 'Tambah Barang';
      $('#stokWrap').style.display = id ? 'none' : '';
      if (id) {
        try {
          const i = (await api('items.php', { params: { id } })).data;
          ['kode', 'nama', 'category_id', 'unit_id', 'warehouse_id', 'stok_min', 'spesifikasi'].forEach((k) => (form[k].value = i[k] ?? ''));
        } catch (e) { return toast(e.message, 'error'); }
      }
      modal.show();
    }

    async function remove(id, name) {
      if (!(await confirmBox(`Hapus barang "${name}"? Tindakan ini tidak dapat dibatalkan.`, { title: 'Hapus Barang' }))) return;
      try { await api('items.php', { method: 'DELETE', params: { id } }); toast('Barang dihapus.'); load(); }
      catch (e) { toast(e.message, 'error'); }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      showFieldErrors(form, {});
      const body = Object.fromEntries(new FormData(form));
      try {
        const res = await withLoading($('#btnSave'), () => api('items.php', { method: editId ? 'PUT' : 'POST', params: editId ? { id: editId } : null, body }));
        toast(res.message);
        modal.hide();
        load();
      } catch (err) { showFieldErrors(form, err.errors); toast(err.message, 'error'); }
    });

    $('#btnAdd')?.addEventListener('click', () => openForm());
    const reload = () => { page = 1; load(); };
    $('#fq').addEventListener('input', debounce(reload));
    ['#fcat', '#fwh', '#flow'].forEach((s) => $(s).addEventListener('change', reload));
    load();
  })();
  </script>
</body>
</html>
