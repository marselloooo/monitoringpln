<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permintaan Barang | Monitoring Barang PLN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="app-body">
<div class="app-shell">
  <aside id="sidebar" class="app-sidebar"></aside>
  <div class="app-backdrop" id="backdrop"></div>
  <div class="app-main">
    <header id="topbar" class="app-topbar"></header>
    <main class="app-content">
      <div class="page-head">
        <div><h1>Permintaan Barang</h1><p>Alur: pengajuan &rarr; persetujuan manajer &rarr; pemrosesan oleh gudang (barang keluar otomatis).</p></div>
        <button class="btn btn-primary" id="btn-add"><i class="bi bi-plus-lg me-1"></i>Ajukan Permintaan</button>
      </div>
      <div class="card-box">
        <div class="filter-bar">
          <div class="row g-2">
            <div class="col-12 col-md-4"><input type="search" id="f-q" class="form-control" placeholder="Cari no. permintaan / unit / keperluan..."></div>
            <div class="col-6 col-md-3 col-lg-2">
              <select id="f-status" class="form-select">
                <option value="">Semua status</option><option value="menunggu">Menunggu</option>
                <option value="disetujui">Disetujui</option><option value="ditolak">Ditolak</option><option value="selesai">Selesai</option>
              </select>
            </div>
            <div class="col-6 col-md-auto"><button class="btn btn-light border w-100" id="btn-reset"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset</button></div>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-modern">
            <thead><tr><th>No. Permintaan</th><th>Tanggal</th><th>Unit / Bagian</th><th>Keperluan</th><th class="text-end">Jenis</th><th>Status</th><th>Diajukan</th><th class="text-end">Aksi</th></tr></thead>
            <tbody id="tbl-body"></tbody>
          </table>
        </div>
        <div id="pager"></div>
      </div>
      <div id="modal-root"></div>
    </main>
    <footer class="app-footer">Sistem Monitoring Barang &middot; Proyek magang</footer>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/permintaan.js"></script>
</body>
</html>
